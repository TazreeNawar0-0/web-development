<!DOCTYPE html>
<html>
    <head>
        <title>Intro to CSS</title>
        <!--Internal CSS-->
        <style>
            p {
                color: rgb(226, 12, 55);
            }
        </style>
        <!--External CSS-->
<link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--Inline CSS-->
        <h1 style="color: rgb(230, 10, 83);">🌺Intro to CSS🌺</h1>
        <p id="Pasta">🌺CSS stands for Cascading Style Sheet.🌺</p>
        <p class="Tazree">🌺Inline CSS🌺</p>
        <p class="Tazree">🌺Internal CSS🌺</p>
        <p class="Tazree">🌺External CSS🌺</p>
    </body>
</html>
