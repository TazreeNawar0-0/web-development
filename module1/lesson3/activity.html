<!DOCTYPE html>
<html>
    <head>
        <title>Links,table and list</title>
    </head>
    <body>
        <!--Adding a Hyperlink-->
        <a href="https://www.foodpanda.com.bd/ "><i>Visit Foodpanda</i></a>

        <!--Ordered List-->
        <ol>
            <li>Chicken</li>
            <li>Pasta</li>
            <li>French fries</li>
        </ol>

        <!--Unordered List-->
        <ul>
            <li>Cat</li>
            <li>Chicks</li>
            <li>Birds</li>
        </ul>
    </body>
</html>
