<!DOCTYPE html>
<html>
    <head>
        <title>Links,table and list</title>
    </head>
    <body>
        <!--Adding a Hyperlink-->
        <a href="https://www.foodpanda.com.bd/ "><i>Visit Foodpanda</i></a>

        <!--Ordered List-->
        <ol>
            <li>Chicken</li>
            <li>Pasta</li>
            <li>French fries</li>
        </ol>

        <!--Unordered List-->
        <ul>
            <li>Cat</li>
            <li>Chicks</li>
            <li>Birds</li>
        </ul>

        <!--Adding a table-->
        <table border="1">
        <tr bgcolor="pink">
            <th>Name</th>
            <th>Food</th>
            <th>Blood Group</th>
        </tr>
        
        <tr>
            <td>Tazree </td>
            <td bgcolor="lightblue">Pasta</td>
            <td bgcolor="yellow">O+</td>
        </tr>

        <tr>
            <td>Ducky</td>
            <td bgcolor="lightblue">plants,seeds,insects,and small aquatic animals</td>
            <td bgcolor="yellow">Unknown</td>
        </tr>

        <tr>
            <td>Chicks</td>
            <td bgcolor="lightblue">Chick food</td>
            <td bgcolor="yellow">Unknown</td>
        </tr>
        </table>
    </body>
</html>
