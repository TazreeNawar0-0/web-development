<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>🌺My Cool Science Lab!!🌺</h1>
        <p class="lead">🌺Welcome to the lab! here are the experiments running.🌺</p>
        <button class="btn btn-primary">🌺Physics🌺</button>
        <button class="btn btn-info">🌺Chemistry🌺</button>
        <button class="btn btn-success">🌺Biology🌺</button>
        <button class="btn btn-warning">🌺History🌺</button>
        <button class="btn btn-danger">🌺Mathmatics🌺</button>
    </div>
    <div class="container mt-3">
        <h2>🌺Experiments Completed🌺</h2>
        <p>🌺Physics🌺<span class="badge text-bg-primary">10 experiments</span></p>
        <p>🌺Chemistry🌺<span class="badge text-bg-info">9 experiments</span></p>
        <h2>Research Progress</h2>
        <p>🌺Physics🌺</p>
        <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0"
            aria-valuemax="100">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
        </div>
        <p>🌺Chemistry🌺</p>
        <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0"
            aria-valuemax="100">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 75%"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
