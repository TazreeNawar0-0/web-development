<!DOCTYPE html>
<html>
    <head>
        <title>Array in JS</title>
    </head>
    <body>
        <h2>JS Arrays</h2>
        <p id ="demo"></p>
        <p id="join"></p>
        <p id="pop"></p>

        <script>
            var fruits = ["Apple", "Strawberry","Mango","Banana","Orange"];
            
            //Accessing an item

            document.getElementById("demo").innerHTML = fruits[1]

            //Joining the item of an array

            document.getElementById("join").innerHTML = fruits.join("~ ")

            //Removing the last item of an array

            fruits.pop();
            document.getElementById("pop").innerHTML = fruits;

        </script>
    </body>
</html>
